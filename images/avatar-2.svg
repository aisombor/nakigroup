  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="80" fill="url(#bgGrad2)" />
  <circle cx="80" cy="80" r="76" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

